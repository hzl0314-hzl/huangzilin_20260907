<!DOCTYPE html>
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>个人简介</title>
    <style>
        h2{
            color: blue;
        }
        img{
            width: 200px;
            border-radius: 8px;
        }
    </style>
    <script>
        function showMsg(){
            alert("来自内嵌式JS：你好，黄梓森！");
        }
    </script>
</head>
<body>
    <h2>我的个人简介</h2>
    <!-- 插入图片，把src替换成你的图片路径 -->
    <img src="avatar.jpg" alt="个人照片">

    <p style="color:red;">姓名：黄梓森</p>
    <p>爱好：编程</p>
    <p>简介：喜欢写代码，不断学习进步</p>

    <input type="button" value="点击测试行内JS" onclick="alert('行内JS触发成功！')">
    <br><br>
    <input type="button" value="点击测试内嵌JS" onclick="showMsg()">

    <!-- JS外链式，取消注释即可使用 -->
    <!-- <script src="test.js"></script> -->
</body>
</html>
